<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Dashboard</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --line: #e4e1da; --text: #1f1e1c; --muted: #77736b;
  --claude: #c96442; --codex: #3d6fd8; --antigravity: #2f9e74; --muse: #8a5cf6;
  --busy: #e0a100; --open: #3d9a5c; --done: #b5b0a6; --ask: #d6336c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161514; --panel: #201f1d; --line: #34322e; --text: #ece9e3; --muted: #9a958b;
    --claude: #e08463; --codex: #7aa2f2; --antigravity: #5cc79d; --muse: #a98bfa; --done: #5d5a54;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
  background: var(--bg); z-index: 2; }
h1 { font-size: 17px; margin: 0; font-weight: 650; }
/* ヘッダーに常に出しておく使用量の円 */
#rings { display: flex; gap: 14px; align-items: center; }
.ring-group { display: flex; gap: 6px; align-items: center; }
.ring { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 10px; color: var(--muted); line-height: 1; }
.ring .dial { position: relative; width: 32px; height: 32px; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .dial b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; font-weight: 600;
  color: var(--text); font-variant-numeric: tabular-nums; }
.ring.warn { --c: var(--busy) !important; }
.ring.full { --c: #c0392b !important; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-left: auto; color: var(--muted); font-size: 13px; }
.controls > label { display: inline-flex; align-items: center; gap: 4px; height: 24px; }
select, input { font: inherit; }
select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 0 4px; height: 24px; }
#q { height: 24px; width: 200px; padding: 0 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
  color: var(--text); font-size: 12px; }
#q:focus { outline: none; border-color: var(--muted); }
#updated { font-variant-numeric: tabular-nums; }
main { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 16px; padding: 16px 20px 40px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px 40px; } header { padding: 12px 16px; } }
.col { min-width: 0; }
.col h2 { display: flex; align-items: center; gap: 8px; font-size: 15px; margin: 0 0 10px; }
.col h2 .swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.col h2 .count { color: var(--muted); font-weight: 400; font-size: 13px; }
.col h2 .live { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--busy); }
.section-label { font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c);
  border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.card.done { border-left-color: var(--line); }
.top { display: flex; gap: 8px; align-items: baseline; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; transform: translateY(-1px); background: var(--done); }
.busy .dot { background: var(--busy); box-shadow: 0 0 0 3px color-mix(in srgb, var(--busy) 25%, transparent); animation: pulse 1.6s infinite; }
.open .dot { background: var(--open); }
.ask .dot { background: var(--ask); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ask) 25%, transparent); }
.card.ask { border-color: var(--ask); }
.col h2 .asking { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--ask); }
.col h2 .live + .asking { margin-left: 0; }
@keyframes pulse { 50% { opacity: .45; } }
.title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.time { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meta { color: var(--muted); font-size: 12px; margin: 2px 0 0 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg { margin: 6px 0 0 16px; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.msg b { color: var(--muted); font-weight: 500; margin-right: 4px; }
/* 応答の高さは右上の「応答」で 2・5・10 行から選ぶ。5行以上は改行を残した全文を切り詰めて出す */
.msg.reply { -webkit-line-clamp: var(--rows, 2); }
.msg.reply.long { white-space: pre-wrap; }
/* 指示は右、応答は左の吹き出しにして、チャットのように読めるようにする。ラベルは読み上げ用に残して画面からは隠す */
.msg.prompt, .msg.reply, .msg.question { display: block; -webkit-line-clamp: unset; width: fit-content; max-width: 88%;
  padding: 5px 10px; line-height: 1.55; }
/* 行数の切り詰めは中の文に掛ける（吹き出しの余白に次の行がのぞかないように） */
.msg .t { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; -webkit-line-clamp: 2; }
.msg.reply .t { -webkit-line-clamp: var(--rows, 2); }
.msg.question .t { -webkit-line-clamp: 6; white-space: pre-wrap; }
.msg.full .t { display: block; -webkit-line-clamp: unset; }
.msg.question { margin: 6px 0 0 16px; border-radius: 12px 12px 12px 3px; border: 1.5px solid var(--ask);
  background: color-mix(in srgb, var(--ask) 10%, var(--panel)); }
.msg.prompt { margin: 8px 0 0 auto; border-radius: 12px 12px 3px 12px;
  background: color-mix(in srgb, var(--c) 16%, var(--panel)); }
.msg.reply { margin: 6px 0 0 16px; border-radius: 12px 12px 12px 3px; background: var(--bg); border: 1px solid var(--line); }
.msg.prompt.full, .msg.reply.full { max-width: 100%; }
/* 切り詰めた文のすぐ下に出す「さらに表示」（X のような文中リンク） */
.msg .more { display: inline; border: 0; padding: 0; background: none; font-size: 13px; color: var(--c);
  cursor: pointer; margin-top: 2px; }
.msg .more:hover { text-decoration: underline; color: var(--c); }
.msg.prompt > b, .msg.reply > b, .msg.question > b { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.msg a, .job a { color: var(--c); text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
.msg.full { display: block; -webkit-line-clamp: unset; white-space: pre-wrap; max-height: 420px; overflow: auto;
  cursor: text; user-select: text; }
.actions .spacer { flex: 1; }
/* 返信は押しやすいように、開くボタンとコピーのあいだを横いっぱいに使う */
.actions [data-act="toggle"] { flex: 1 1 120px; }
.actions [data-act="toggle"] + .spacer { flex: 0; }
.job-wrap { position: relative; }
.job-wrap .copy { position: absolute; top: 6px; right: 6px; background: var(--panel); }
.card { transition: border-color .15s, background .15s; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0 16px; }
button { font: inherit; font-size: 12px; color: var(--text); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; cursor: pointer; white-space: nowrap; flex: none; }
button:hover:not(:disabled) { border-color: var(--c); color: var(--c); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--c); border-color: var(--c); color: #fff; }
button.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
.reply-box { margin: 8px 0 0 16px; cursor: default; }
.reply-box textarea { width: 100%; min-height: 64px; resize: vertical; font: inherit; font-size: 13px;
  color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.reply-box textarea:focus { outline: none; border-color: var(--c); }
.reply-box .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.reply-box .hint { color: var(--muted); font-size: 11px; margin-right: auto; }
/* 送信を押してから返事が来るまでのくるくる */
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent;
  border-radius: 50%; animation: spin .7s linear infinite; margin-right: 5px; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
.reply-box.sending button { cursor: progress; }
.msg.reply.wait { color: var(--muted); }
/* 動作中のターンで、いまの応答より前に出た文（新しい順） */
.turn-log { margin: 4px 0 0 16px; padding-left: 10px; border-left: 2px solid var(--line); max-height: 260px; overflow: auto; }
.turn-log div { font-size: 12px; color: var(--muted); margin: 4px 0; display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.turn-log time { font-variant-numeric: tabular-nums; margin-right: 6px; opacity: .8; }
.reply-box.sending button.primary:disabled { opacity: 1; }  /* くるくるが薄くならないように */
/* Remote Control の状態（起動中の Claude のチャットだけ）と、付いたり外れたりした記録 */
.rc { display: inline-block; font-size: 10px; line-height: 15px; padding: 0 5px; margin-left: 6px; border-radius: 4px;
  border: 1px solid currentColor; vertical-align: 1px; }
.rc.on { color: var(--open); }
/* コンテキストの量。モデルの上限に対する割合（上限はモデル名からの推定。アプリの表示と同じ計算） */
/* 「○分前」の横に、棒と % だけを小さく出す（1行を取らない） */
.ctx { white-space: nowrap; flex: none; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ctx .bar { display: inline-block; width: 28px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden;
  vertical-align: 2px; margin-left: 4px; }
.ctx .bar i { display: block; height: 100%; background: var(--c); }
.ctx.warn .bar i { background: var(--busy); }
.ctx.full .bar i { background: #c0392b; }
.rc.off { color: #c0392b; }
#rclog { position: fixed; top: 64px; right: 16px; width: min(560px, calc(100vw - 32px)); max-height: 70vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; z-index: 5;
  box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 12px; }
#rclog[hidden] { display: none; }
#rclog table { width: 100%; border-collapse: collapse; }
#rclog td { padding: 3px 6px; border-top: 1px solid var(--line); white-space: nowrap; }
#rclog td.name { white-space: normal; }
#rclog .ev-off, #rclog .ev-end { color: #c0392b; }
#rclog .ev-on, #rclog .ev-start-on { color: var(--open); }
/* 列の見出しの「＋ 新規」と、新しいチャットの入力欄 */
.col h2 { flex-wrap: wrap; row-gap: 4px; }
.col h2 .count, .col h2 .live, .col h2 .asking { white-space: nowrap; }
.col h2 .new-btn { font-size: 12px; font-weight: 500; padding: 1px 8px; margin-left: auto; }
.col h2 .live ~ .new-btn, .col h2 .asking ~ .new-btn { margin-left: 8px; }
.new-box { margin: 0 0 12px; padding: 10px; border: 1px solid var(--c); border-radius: 8px; background: var(--panel); }
.new-box .fields { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; margin-bottom: 6px;
  font-size: 12px; color: var(--muted); }
.new-box input[type=text], .new-box select { font: inherit; font-size: 12px; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; height: 26px; padding: 0 6px; min-width: 0; }
.new-box .job { margin-left: 0; }
.job { margin: 8px 0 0 16px; font-size: 13px; padding: 6px 8px; border-radius: 6px;
  background: var(--bg); border: 1px dashed var(--line); white-space: pre-wrap; word-break: break-word;
  max-height: 220px; overflow: auto; cursor: text; }
.job.running { color: var(--muted); }
.job.error { color: #c0392b; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text);
  color: var(--bg); padding: 6px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: .92; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
.err { color: #c0392b; font-size: 12px; }
.cols { display: flex; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px;
  height: 24px; box-sizing: border-box; padding: 0 10px 0 8px; cursor: pointer; user-select: none; font-size: 12px; white-space: nowrap; }
.chip input { display: none; }
.chip .sw { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.chip:has(input:not(:checked)) { opacity: .45; }
.chip:has(input:not(:checked)) .sw { background: var(--line); }
.usage { color: var(--muted); font-size: 12px; margin: -4px 0 8px; display: flex; flex-direction: column; gap: 4px; }
.usage b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.limit { display: flex; align-items: center; gap: 6px; }
.limit .bar { flex: 1; max-width: 140px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.limit .bar i { display: block; height: 100%; background: var(--c); }
.meta .model { color: var(--text); opacity: .75; }
.host { display: inline-block; font-size: 11px; line-height: 16px; padding: 0 6px; margin-right: 6px; border-radius: 4px;
  border: 1px solid var(--line); color: var(--text); }
/* 端末ごとの表示切り替え。道具の列とのあいだに細い区切り線を入れる */
#hosts { display: flex; gap: 6px; padding-left: 12px; border-left: 1px solid var(--line); }
#hosts:empty { display: none; }
#hosts .chip { --c: var(--muted); }
#hosts .chip.err { color: #c0392b; border-color: currentColor; --c: #c0392b; }
.thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.thumbs div { position: relative; }
.thumbs img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
.thumbs button { position: absolute; top: -6px; right: -6px; padding: 0 5px; border-radius: 50%; font-size: 11px;
  background: var(--panel); line-height: 16px; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin: 10px 0 6px; }
</style>
</head>
<body>
<header>
  <h1>Agent Dashboard</h1>
  <div id="rings"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="キーワードで絞り込み" title="題名・最後の指示と応答・フォルダ・端末名から探します（スペース区切りはすべて含むもの）">
    <div class="cols" id="cols"></div>
    <span id="hosts"></span>
    <label>期間 <select id="days">
      <option value="1">24時間</option><option value="3" selected>3日</option>
      <option value="7">7日</option><option value="30">30日</option>
    </select></label>
    <label>応答 <select id="rows" title="カードに出す応答の行数">
      <option value="2">小</option><option value="5">中</option><option value="10">大</option>
    </select></label>
    <label><input type="checkbox" id="showAuto"> 自動実行も表示</label>
    <button id="rcbtn" title="Remote Control が付いたり外れたりした記録">RC記録</button>
    <span id="updated"></span>
  </div>
</header>
<main id="main"></main>
<div id="rclog" hidden></div>
<div class="toast" id="toast"></div>
<script>
const TOOLS = [
  ["claude", "Claude Code", "var(--claude)"],
  ["codex", "Codex", "var(--codex)"],
  ["antigravity", "Antigravity", "var(--antigravity)"],
  ["muse", "Muse", "var(--muse)"],
];
const STATE_LABEL = { ask: "質問あり", busy: "動作中", open: "開いている", done: "", archived: "アーカイブ" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 文中の URL をクリックできるリンクにする（エスケープ済みの文字列に使う）。
// 日本語の句読点や閉じかっこ、末尾の「…」で省略された URL はリンクにしない
const URL_RE = /https?:\/\/(?:(?!&quot;|&lt;|&gt;)[^\s<>"'`*）」』】、。…])*(?:(?!&quot;|&lt;|&gt;)[^\s<>"'`*）」』】、。…).,:;!?])/g;
const linkify = (html) => html.replace(URL_RE, (u, at, all) =>
  all[at + u.length] === "…" ? u : `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);

let hiddenCols = new Set();
let hiddenHosts = new Set();  // 表示しない端末（"" はこのPC）
try {
  $("#days").value = localStorage.getItem("days") || "3";
  $("#showAuto").checked = localStorage.getItem("showAuto") === "1";
  $("#rows").value = localStorage.getItem("rows") || "2";
  hiddenCols = new Set(JSON.parse(localStorage.getItem("hiddenCols") || "[]"));
  hiddenHosts = new Set(JSON.parse(localStorage.getItem("hiddenHosts") || "[]"));
} catch {}
$("#cols").innerHTML = TOOLS.map(([k, name, color]) =>
  `<label class="chip" style="--c:${color}" title="${name} の列を表示/非表示">
    <input type="checkbox" value="${k}" ${hiddenCols.has(k) ? "" : "checked"}><span class="sw"></span>${name}</label>`).join("");
$("#hosts").onchange = (e) => {
  e.target.checked ? hiddenHosts.delete(e.target.value) : hiddenHosts.add(e.target.value);
  try { localStorage.setItem("hiddenHosts", JSON.stringify([...hiddenHosts])); } catch {}
  render();
};
$("#cols").onchange = (e) => {
  e.target.checked ? hiddenCols.delete(e.target.value) : hiddenCols.add(e.target.value);
  try { localStorage.setItem("hiddenCols", JSON.stringify([...hiddenCols])); } catch {}
  render();
};

function fmtTok(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return Math.round(n / 1e3) + "K";
  return String(n);
}
// 入力+出力。キャッシュ読み込みは桁違いに大きく、料金も安いので別表示
const ioTok = (t) => (t ? t.input + t.output : 0);
function tokTitle(t) {
  return t ? `入力 ${t.input.toLocaleString()} / 出力 ${t.output.toLocaleString()} / キャッシュ読込 ${t.cache.toLocaleString()}` : "";
}

function ago(ts) {
  const s = Date.now() / 1000 - ts;
  if (s < 60) return "たった今";
  if (s < 3600) return `${Math.floor(s / 60)}分前`;
  if (s < 86400) return `${Math.floor(s / 3600)}時間前`;
  return `${Math.floor(s / 86400)}日前`;
}
function project(cwd) {
  if (!cwd) return "";
  if (cwd.includes("/scratchpad")) return "scratchpad";
  return cwd.replace(/\/+$/, "").split("/").slice(-2).join("/");
}
const OPEN_LABEL = { claude: "Claude で開く", codex: "Codex で開く", antigravity: "ターミナルで開く" };
const openLabel = (it) => {
  if (it.host && it.bridge_id) return "claude.ai で開く";
  return it.tool === "antigravity" && it.via === "ide" ? "Antigravity を開く" : OPEN_LABEL[it.tool];
};
const isPaste = (it) => it.reply_mode === "paste" || it.reply_mode === "bridge";
// 待機中で開いたままのチャットは「止めて送る」を標準にする（会話は分かれず、トークンもほぼ増えない）
const stopDefault = (it) => it.can_stop_send && isPaste(it) && !it.auto_paste;
const NO_REPLY = {
  claude: "CLI で実行中です",
  codex: "実行中かアーカイブ済みです",
  antigravity: "実行中です",
};
// 再描画（5秒ごと）をまたいで残す UI 状態
const ui = { replyOpen: new Set(), drafts: {}, jobs: {}, images: {}, expanded: new Set(),
  newOpen: new Set(), newForm: {}, sending: new Set(),
  waiting: {} };  // waiting[カード] = { since, text }: ダッシュボードから送って、まだその応答が来ていない  // sending: 送信を押して返事待ちの欄（カードのキーか new:道具）  // newForm[道具] = { host, cwd, text }
// 同じセッション ID が別のマシンにもあり得るので、マシン名も含める
const key = (it) => `${it.tool}:${it.host || ""}:${it.id}`;

// 開いたカードでは「閉じる」を最後の吹き出しにだけ付ける（last）
function msgRow(label, short, fullText, expanded, reply = false, last = false) {
  if (!short) return "";
  const kind = reply ? "reply" : "prompt";
  const text = linkify(esc(fullText || short));
  if (expanded) return `<div class="msg ${kind} full"><b>${label}</b><div class="t">${text}</div>${
    last ? `<button class="more" data-act="expand">閉じる</button>` : ""}</div>`;
  // 「さらに表示」はいったん全部に付け、実際に切れていない文からは描画のあと pruneMore() で外す
  const more = `<button class="more" data-act="expand">さらに表示</button>`;

function pruneMore() {

    const t = b.previousElementSibling;
    if (t.scrollHeight <= t.clientHeight + 1 && !t.textContent.endsWith("…")) b.remove();

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return toast("コピーしました"); } catch {}
  // Clipboard API が使えない環境向けの予備
  const ta = Object.assign(document.createElement("textarea"), { value: text });
  ta.style.cssText = "position:fixed;opacity:0";
  document.body.append(ta);
  ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  toast(ok ? "コピーしました" : "コピーできませんでした");
}

function ctxMeter(it) {
  const c = it.context;
  if (!c || !c.tokens || !c.window) return "";
  const pct = Math.min(100, Math.round(c.tokens / c.window * 100));
  const cls = pct >= 85 ? "full" : pct >= 65 ? "warn" : "";
  return `<span class="ctx ${cls}" title="コンテキスト ${c.tokens.toLocaleString()} / 上限 ${c.window.toLocaleString()} トークン（上限はモデル名からの推定）"><span class="bar"><i style="width:${pct}%"></i></span> ${pct}%</span>`;
}

}

  const w = ui.waiting[k];

    ${it.model || ioTok(it.tokens) ? `<div class="meta">${it.model ? `<span class="model">${esc(it.model)}</span>` : ""}${
      ioTok(it.tokens) ? `<span title="${tokTitle(it.tokens)}">${it.model ? " · " : ""}${fmtTok(ioTok(it.tokens))} tokens</span>` : ""}</div>` : ""}
    ${it.question ? `<div class="msg question"><b>質問</b><div class="t">${esc(it.question)}</div></div>` : ""}
    ${waiting
      ? msgRow("指示", ui.waiting[k]?.text || it.prompt, ui.waiting[k] ? null : it.prompt_full, full, false, true)
        + `<div class="msg reply wait"><span class="spin"></span>応答を待っています…</div>`
      : msgRow("指示", it.prompt, it.prompt_full, full, false, !it.reply) + msgRow("応答", it.reply, it.reply_full, full, true, true) + turnLog(it)}
    <div class="actions">
      <button data-act="open" ${it.host && !it.bridge_id ? `disabled title="${esc(it.host)} のセッションは、そのマシンで開いてください"` : ""}>${openLabel(it)}</button>
      <button data-act="toggle" ${it.can_reply ? "" : `disabled title="${esc(it.no_reply || NO_REPLY[it.tool])}"`}>返信</button>
      <span class="spacer"></span>

    </div>

      <textarea placeholder="このチャットに送る内容（画像は貼り付けで添付・⌘+Enter で送信）">${esc(ui.drafts[k] || "")}</textarea>
      ${(ui.images[k] || []).length ? `<div class="thumbs">${ui.images[k].map((src, i) =>

      <div class="row"><span class="hint">${it.auto_paste

          : it.reply_mode === "bridge"

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}
async function post(path, body) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Agent-Dashboard": "1" },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}
function findItem(k) {
  const tool = k.split(":")[0];
  return (last?.tools[tool]?.items || []).find((i) => key(i) === k);
}
async function openItem(it) {
  try { await post("/api/open", { tool: it.tool, id: it.id, host: it.host }); toast(`「${it.title}」を開きました`); }
  catch (e) { toast(e.message); }
}
// 押した瞬間に、その欄のボタンを止めてくるくるを出す（自動貼り付けなどで数秒かかるため）。描き直しても applySending() で戻す
const boxOf = (k) => k.startsWith("new:") ? document.querySelector(`.new-box[data-tool="${k.slice(4)}"]`)
  : document.querySelector(`.card[data-key="${CSS.escape(k)}"] .reply-box`);
function applySending() {
  ui.sending.forEach((k) => {
    const box = boxOf(k);
    if (!box || box.classList.contains("sending")) return;
    box.classList.add("sending");
    box.querySelectorAll("button, textarea, input, select").forEach((el) => (el.disabled = true));
    const btn = box.querySelector("button.primary");
    if (btn) btn.innerHTML = `<span class="spin"></span>${k.startsWith("new:") ? "開始中…" : "送信中…"}`;
  });
}
async function sendReply(it, k, stop = false) {
  const text = (ui.drafts[k] || "").trim();
  const images = ui.images[k] || [];
  if (!text && !images.length) return;
  if (ui.sending.has(k)) return;  // 二度押しで二重に送らない
  ui.sending.add(k);
  applySending();
  try {
    const job = await post("/api/reply", { tool: it.tool, id: it.id, host: it.host, text, images, stop });
    ui.sending.delete(k);
    ui.waiting[k] = { since: Date.now() / 1000, text };
    ui.jobs[k] = job;
    ui.drafts[k] = "";
    ui.images[k] = [];
    ui.replyOpen.delete(k);
    render();
    pollJob(k, job.id);
  } catch (e) { ui.sending.delete(k); render(); toast(e.message); }
}
async function pollJob(k, id) {
  while (true) {
    await new Promise((r) => setTimeout(r, 2000));
    const job = await fetch(`/api/job?id=${id}`).then((r) => r.json()).catch(() => null);
    if (!job || job.error) return;
    ui.jobs[k] = job;
    if (job.status !== "running") { render(); load(); return; }
  }
}

document.addEventListener("click", (e) => {
  const cardEl = e.target.closest(".card[data-key]");
  // 全文や返事の欄は文字を選べるよう、クリックでアプリを開かない
  if (!cardEl || (e.target.closest(".reply-box, .job, .msg.full") && !e.target.closest("button"))) return;
  const k = cardEl.dataset.key, it = findItem(k);
  if (!it) return;
  const act = e.target.closest("button")?.dataset.act;
  if (act === "expand") {
    ui.expanded.has(k) ? ui.expanded.delete(k) : ui.expanded.add(k);
    render();
  } else if (act === "copy") {
    copyText(it.reply_full || it.reply);
  } else if (act === "copyjob") {
    copyText(ui.jobs[k]?.output || "");
  } else if (act === "toggle") {
    ui.replyOpen.has(k) ? ui.replyOpen.delete(k) : ui.replyOpen.add(k);
    render();
    document.querySelector(`.card[data-key="${CSS.escape(k)}"] textarea`)?.focus();
  } else if (act === "open") {
    // 誤タップで移動しないよう、アプリへ移るのは「〜で開く」ボタンのときだけ
    openItem(it);
  }
});
document.addEventListener("click", (e) => {

// 入力欄に画像を貼り付けると添付になる
document.addEventListener("paste", (e) => {
  const ta = e.target.closest?.(".reply-box textarea");
  if (!ta || ta.closest(".new-box")) return;
  const files = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith("image/"));
  if (!files.length) return;
  e.preventDefault();
  const k = ta.closest(".card").dataset.key;
  ui.images[k] ||= [];
  files.forEach((f) => {
    if (ui.images[k].length >= 5) return toast("画像は5枚までです");
    if (f.size > 10 * 1024 * 1024) return toast("画像は1枚 10MB までです");
    const r = new FileReader();
    r.onload = () => {
      ui.images[k].push(r.result);
      render();
      const el = document.querySelector(`.card[data-key="${CSS.escape(k)}"] textarea`);
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }

    r.readAsDataURL(f);

});

document.addEventListener("keydown", (e) => {

});
const DAYS_LABEL = { 1: "24時間", 3: "3日", 7: "7日", 30: "30日" };
// リセット時刻を過ぎた記録は古いので 0% とみなす
function limitState(l) {
  const reset = l.resets_at * 1000;
  const pct = reset < Date.now() ? 0 : l.used_percent;
  const when = reset < Date.now() ? "リセット済み" : `${new Date(reset).toLocaleString([], { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })} にリセット`;
  return { pct, when };
}
function limitRow(label, l) {
  if (!l) return "";
  const { pct, when } = limitState(l);
  return `<div class="limit">${label}<span class="bar"><i style="width:${Math.min(100, pct)}%"></i></span><b>${pct}%</b><span>${when}</span></div>`;
}
function usage(key, t, items) {
  if (key === "antigravity") {
    // トークン数は読めないが、使用制限は agy の /usage から取れる
    if (!t.quota) return `<div class="usage">使用制限を取得中…（トークン数はデータから読み取れません）</div>`;
    const name = (q) => `${q.group.replace(" models", "").replace("Models", "")} ${/Five Hour/i.test(q.label) ? "5時間" : /Weekly/i.test(q.label) ? "週" : q.label}`;
    return `<div class="usage">${t.quota.map((q) => limitRow(esc(name(q)), q)).join("")}</div>`;
  }
  const sum = { input: 0, output: 0, cache: 0 };
  items.forEach((i) => i.tokens && ["input", "output", "cache"].forEach((f) => (sum[f] += i.tokens[f])));
  let html = `<div class="usage"><div title="${tokTitle(sum)}">${DAYS_LABEL[$("#days").value] || ""}の入出力 <b>${fmtTok(ioTok(sum))}</b> tokens（キャッシュ読込 ${fmtTok(sum.cache)}）</div>`;
  if (t.limits) html += limitRow("5時間枠", t.limits.primary) + limitRow("週の枠", t.limits.secondary);
  else if (key === "claude") html += `<div>5時間枠・週の枠を取得中…</div>`;
  return html + `</div>`;
}
// 5時間枠と週の枠を、ヘッダーの小さな円で常に見せる（80% で黄、95% で赤）
function ring(label, l, color, tool) {
  if (!l) return "";
  const { pct, when } = limitState(l);
  const r = 13, c = 2 * Math.PI * r, v = Math.min(100, Math.max(0, pct));
  const cls = v >= 95 ? "full" : v >= 80 ? "warn" : "";
  return `<div class="ring ${cls}" style="--c:${color}" title="${tool} ${label}: ${pct}%（${when}）">
    <div class="dial"><svg width="32" height="32" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="${r}" fill="none" stroke="var(--line)" stroke-width="3.5"/>
      <circle cx="16" cy="16" r="${r}" fill="none" stroke="var(--c)" stroke-width="3.5" stroke-linecap="round"
        stroke-dasharray="${(c * v / 100).toFixed(2)} ${c.toFixed(2)}"/></svg><b>${pct}</b></div>${label}</div>`;
}
function rings(data) {
  return TOOLS.filter(([k]) => data.tools[k]?.limits).map(([k, name, color]) => {
    const l = data.tools[k].limits;
    return `<div class="ring-group" title="${name}">${ring("5h", l.primary, color, name)}${ring("1W", l.secondary, color, name)}</div>`;
  }).join("");
}

const query = () => $("#q").value.toLowerCase().split(/\s+/).filter(Boolean);
function matchQuery(it) {
  const words = query();
  if (!words.length) return true;
  const hay = [it.title, it.prompt, it.prompt_full, it.reply, it.reply_full, it.question, it.cwd, it.host, it.model]
    .filter(Boolean).join(" ").toLowerCase();
  return words.every((w) => hay.includes(w));
}
$("#q").addEventListener("input", () => render());
function column([key, name, color], data) {
  if (key === "muse") return museColumn(name, color);
  const t = data.tools[key] || { items: [] };
  const showAuto = $("#showAuto").checked;
  const all = t.items.filter((i) => !hiddenHosts.has(i.host || ""));
  const items = all.filter((i) => showAuto || !i.auto);
  const hidden = all.length - items.length;
  // キーワードは画面が持っている分（題名・最後の指示と応答など）から探すだけなので、サーバーの負担は増えない
  const hits = items.filter(matchQuery);
  // 状態で分けず、更新の新しい順に1本で並べる（開いている／終わったの色の違いが分かりにくいため）
  const sorted = [...hits].sort((a, b) => b.updated - a.updated);
  const busy = items.filter((i) => i.state === "busy").length;
  const asking = items.filter((i) => i.state === "ask").length;
  let html = `<section class="col" style="--c:${color}">
    <h2><span class="swatch"></span>${name}<span class="count">${query().length ? `${hits.length} / ${items.length}件` : `${items.length}件`}</span>
    ${busy ? `<span class="live">● ${busy} 動作中</span>` : ""}${asking ? `<span class="asking">● ${asking} 質問あり</span>` : ""}
    ${NEW_TOOLS.includes(key) ? `<button class="new-btn" data-new="${key}" title="この列の道具で新しいチャットを始める">＋ 新規</button>` : ""}</h2>`
    + usage(key, t, items) + (ui.newOpen.has(key) ? newBox(key, t) : "");
  if (t.error) html += `<div class="err">読み込みエラー: ${esc(t.error)}</div>`;
  const head = sorted.slice(0, 20), tail = sorted.slice(20);
  html += head.map(card).join("");
  if (tail.length) html += `<details><summary>さらに ${tail.length} 件</summary>${tail.map(card).join("")}</details>`;
  if (!items.length) html += `<div class="empty">この期間のセッションはありません</div>`;
  else if (!hits.length) html += `<div class="empty">「${esc($("#q").value.trim())}」に当てはまるチャットはありません</div>`;
  if (hidden) html += `<div class="empty">自動実行 ${hidden} 件を非表示</div>`;
  return html + `</section>`;
}

// 新しいチャットは、ダッシュボードからフォルダと依頼文を渡して CLI で始める
const NEW_TOOLS = ["claude", "codex"];
function newBox(tool, t) {
  const f = ui.newForm[tool] ||= {};

  f.host ??= "";
  // 選んだ端末で最近使ったフォルダを候補に出す
  // Codex の記録は Windows で「\\?\C:\...」の形なので、頭の「\\?\」を外す。worktree の中は候補にしない
  const cwds = [...new Set(t.items.filter((i) => (i.host || "") === f.host && i.cwd && !/[\\/]\.claude[\\/]worktrees[\\/]/.test(i.cwd))
    .sort((a, b) => b.updated - a.updated).map((i) => i.cwd.replace(/^\\\\\?\\/, "")))].slice(0, 15);
  f.cwd ??= cwds[0] || "";
  const job = ui.jobs[`new:${tool}`];
  return `<div class="reply-box new-box" data-tool="${tool}">
    <div class="fields">
      <span>端末</span><select name="host">${[["", "このPC"], ...hosts.map((h) => [h.name, h.name])].map(([v, n]) =>
        `<option value="${esc(v)}" ${f.host === v ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
      <span>フォルダ</span><input type="text" name="cwd" list="cwds-${tool}" value="${esc(f.cwd)}" placeholder="空ならホームフォルダ">
      <datalist id="cwds-${tool}">${cwds.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
    </div>
    <textarea name="text" placeholder="新しいチャットで頼むこと（Tab → Enter か Ctrl+Enter で開始）">${esc(f.text || "")}</textarea>
    <div class="row"><span class="hint" title="そのフォルダで CLI の新しいチャットを始めます。ファイル編集など許可が要る操作は、確認を出せないので止まります">許可が要る操作は止まります</span>
      <button data-act="newcancel">やめる</button><button class="primary" data-act="newsend">開始</button></div>
    ${job ? `<div class="job ${job.status}">${job.status === "running" ? `<span class="spin"></span>実行中…` : linkify(esc(job.output || (job.status === "done" ? "始めました" : "失敗しました")))}</div>` : ""}
  </div>`;
}
async function sendNew(tool) {
  const f = ui.newForm[tool] || {};
  const text = (f.text || "").trim();
  if (!text) return toast("依頼文を書いてください");
  const k = `new:${tool}`;
  if (ui.sending.has(k)) return;
  ui.sending.add(k);
  applySending();
  try {
    const job = await post("/api/new", { tool, host: f.host || null, cwd: f.cwd || "", text });
    ui.sending.delete(k);
    ui.jobs[`new:${tool}`] = job;
    f.text = "";
    render();
    pollJob(`new:${tool}`, job.id);
  } catch (e) { ui.sending.delete(k); render(); toast(e.message); }
}
document.addEventListener("click", (e) => {
  const nb = e.target.closest("[data-new]");
  if (nb) {
    const tool = nb.dataset.new;
    ui.newOpen.has(tool) ? ui.newOpen.delete(tool) : ui.newOpen.add(tool);
    render();
    document.querySelector(`.new-box[data-tool="${tool}"] textarea`)?.focus();
    return;
  }
  const btn = e.target.closest(".new-box button");
  if (!btn) return;
  const tool = btn.closest(".new-box").dataset.tool;
  if (btn.dataset.act === "newcancel") { ui.newOpen.delete(tool); render(); }
  if (btn.dataset.act === "newsend") sendNew(tool);
});
// 端末を変えたらフォルダの候補も変わるので描き直す
document.addEventListener("change", (e) => {
  const nb = e.target.closest?.(".new-box");
  if (!nb || e.target.name !== "host") return;
  const f = ui.newForm[nb.dataset.tool];
  f.host = e.target.value; delete f.cwd;
  render();
});

// Remote Control の記録。開いている間は 15 秒ごとに読み直す
const RC_EVENT = { "on": "オンになった", "off": "オフになった", "start-on": "起動（オン）", "start-off": "起動（オフ）", "end": "終了" };
async function loadRcLog() {
  const box = $("#rclog");
  if (box.hidden) return;
  try {
    const { events } = await fetch("/api/rclog").then((r) => r.json());
    box.innerHTML = `<b>Remote Control の記録</b>（新しい順・この画面を開いていないときも 15 秒ごとに記録）
      <table>${(events || []).map((e) => `<tr class="ev-${esc(e.event)}">
        <td>${new Date(e.ts * 1000).toLocaleString([], { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" })}</td>
        <td>${esc(e.host || "このPC")}</td><td class="name">${esc(e.name)}</td><td>${esc(RC_EVENT[e.event] || e.event)}</td>
        <td>${esc(e.status || "")}</td></tr>`).join("") || `<tr><td>まだ記録がありません</td></tr>`}</table>`;
  } catch { box.textContent = "記録を読めませんでした"; }
}
$("#rcbtn").onclick = () => {
  const box = $("#rclog");
  box.hidden = !box.hidden;
  box.style.top = `${document.querySelector("header").getBoundingClientRect().bottom + 6}px`;  // 折り返したヘッダーの下に出す
  loadRcLog();
};
setInterval(loadRcLog, 15000);

let last = null;
function render() {
  if (!last) return;
  const open = [...document.querySelectorAll("details")].map((d) => d.open);
  // 全文や返事の欄のスクロール位置を描き直しのあとも保つ
  const scrolls = [...document.querySelectorAll(".msg.full, .job, .turn-log")].map((el) =>
    [el.closest(".card")?.dataset.key, el.className, el.scrollTop]);
  const shown = TOOLS.filter(([k]) => !hiddenCols.has(k));
  $("#main").style.setProperty("--n", Math.max(1, shown.length));
  $("#main").innerHTML = shown.length
    ? shown.map((t) => column(t, last)).join("")
    : `<div class="empty">表示する列がありません。右上で選んでください</div>`;
  pruneMore();
  applySending();
  document.querySelectorAll("details").forEach((d, i) => (d.open = !!open[i]));
  scrolls.forEach(([k, cls, top]) => {
    const el = k && document.querySelector(`.card[data-key="${CSS.escape(k)}"] .${cls.trim().split(/\s+/).join(".")}`);
    if (el) el.scrollTop = top;
  });
  $("#updated").textContent = "更新 " + new Date(last.generated * 1000).toLocaleTimeString();
  $("#rings").innerHTML = rings(last);
  // 端末ごとの表示切り替え（つながっている別の端末があるときだけ出す）。名前の後ろの … ✕ は接続状態
  const hosts = last.hosts || [];
  const hostChip = (value, name, title, mark = "", err = false) =>
    `<label class="chip${err ? " err" : ""}" title="${esc(title)}（クリックで表示/非表示）">
      <input type="checkbox" value="${esc(value)}" ${hiddenHosts.has(value) ? "" : "checked"}><span class="sw"></span>${esc(name)}${mark}</label>`;
  $("#hosts").innerHTML = hosts.length ? hostChip("", "このPC", "このPC のチャット") + hosts.map((h) => {
    const label = h.error ? "接続できません" : h.loading ? "読み込み中" : `${ago(h.fetched)}に取得`;
    return hostChip(h.name, h.name, `${h.name}: ${h.error || label}`, h.error ? " ✕" : h.loading ? " …" : "", !!h.error);
  }).join("") : "";
}
async function load() {
  try {
    const r = await fetch(`/api/sessions?days=${$("#days").value}`);
    last = await r.json();
    // 入力中に描き直すとカーソルが飛ぶので、入力欄にフォーカスがある間は保留
    // 文字を選んでいる間も、選択が消えないよう保留
    const selecting = String(window.getSelection?.() || "").length > 0;
    // Tab で「送信」ボタンに移ったあとも、Enter を押すまでフォーカスが消えないよう保留
    if (!document.activeElement?.closest(".reply-box") && !selecting) render();
  } catch (e) {
    $("#updated").textContent = "サーバーに接続できません";
  }
}
$("#days").onchange = () => { try { localStorage.setItem("days", $("#days").value); } catch {} load(); };
const applyRows = () => document.documentElement.style.setProperty("--rows", $("#rows").value);
applyRows();
$("#rows").onchange = () => { try { localStorage.setItem("rows", $("#rows").value); } catch {} applyRows(); render(); };
$("#showAuto").onchange = () => { try { localStorage.setItem("showAuto", $("#showAuto").checked ? "1" : "0"); } catch {} render(); };
load();
// 見ていない間（ほかのタブやウインドウの裏）は更新しない。電池と通信の節約。戻ってきたらすぐ更新する
setInterval(() => { if (!document.hidden) load(); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
